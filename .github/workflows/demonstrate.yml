name: verify proposed upstream fixes

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: upstream-fixes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows
            expected_os: win64
            expected_cpu: x86_64
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            expected_os: linux
            expected_cpu: x86_64
          - name: macOS x64
            runner: macos-15-intel
            platform: macos
            expected_os: darwin
            expected_cpu: x86_64
          - name: macOS ARM64
            runner: macos-15
            platform: macos
            expected_os: darwin
            expected_cpu: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install FPC 3.2.2 bootstrap on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'lazarus-3.4-fpc-3.2.2-win64.exe'
          $url = 'https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%2064%20bits/Lazarus%203.4/lazarus-3.4-fpc-3.2.2-win64.exe'
          & curl.exe --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 300 --output $installer $url
          if ($LASTEXITCODE -ne 0) { throw 'FPC installer download failed' }
          $expected = '6ede48350b9890929088bd33aa441e1bf4cf813b21bc38149e3df3bbe673bbd3'
          $actual = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actual -cne $expected) {
            throw "FPC installer digest mismatch: $actual"
          }
          $target = Join-Path $env:RUNNER_TEMP 'lazarus'
          New-Item -ItemType Directory -Force $target | Out-Null
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SP-', "/DIR=$target")
          if ($process.ExitCode -ne 0) {
            throw "FPC installer exited $($process.ExitCode)"
          }
          $bin = Join-Path $target 'fpc/3.2.2/bin/x86_64-win64'
          $compiler = Join-Path $bin 'fpc.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "FPC compiler missing: $compiler"
          }
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install FPC 3.2.2 bootstrap on Linux
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes fpc

      - name: Install checksum-pinned FPC 3.2.2 bootstrap on macOS
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          selected=''
          for version in 16.4 16.1; do
            candidate="/Applications/Xcode_${version}.app/Contents/Developer"
            if [ -d "$candidate" ]; then selected="$candidate"; break; fi
          done
          if [ -z "$selected" ]; then
            echo 'No validated Xcode (16.4 or 16.1) is installed.' >&2
            ls -1 /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          export DEVELOPER_DIR="$selected"
          echo "DEVELOPER_DIR=$selected" >> "$GITHUB_ENV"
          xcodebuild -version

          dmg="$RUNNER_TEMP/fpc-3.2.2.dmg"
          mount="$RUNNER_TEMP/fpc-3.2.2-mount"
          url='https://downloads.sourceforge.net/project/freepascal/Mac%20OS%20X/3.2.2/fpc-3.2.2.intelarm64-macosx.dmg'
          curl --fail --location --retry 4 --retry-all-errors "$url" --output "$dmg"
          echo '05d4510c8c887e3c68de20272abf62171aa5b2ef1eba6bce25e4c0bc41ba8b7d  '"$dmg" | shasum -a 256 --check
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          cleanup() { hdiutil detach "$mount" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          package="$mount/fpc-3.2.2-intelarm64-macosx.mpkg"
          test -d "$package"
          sudo installer -pkg "$package" -target /
          unitdir='/usr/local/lib/fpc/3.2.2'
          test -x "$unitdir/ppcx64"
          test -x "$unitdir/ppca64"
          if [ ! -f /etc/fpc.cfg ]; then
            sudo "$unitdir/samplecfg" "$unitdir"
          fi
          test -f /etc/fpc.cfg
          echo '/usr/local/bin' >> "$GITHUB_PATH"

      - name: Build pinned FPC 3.2.3 toolchain
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/install-fpc-3.2.3.ps1
          if ($LASTEXITCODE -ne 0) { throw 'FPC 3.2.3 build failed' }

      - name: Verify toolchain target
        shell: pwsh
        run: |
          $version = (fpc -iV).Trim()
          $targetOs = (fpc -iTO).Trim().ToLowerInvariant()
          $targetCpu = (fpc -iTP).Trim().ToLowerInvariant()
          Write-Host "FPC $version $targetCpu-$targetOs"
          if ($version -ne '3.2.3') {
            throw "expected FPC 3.2.3, got $version"
          }
          if ($env:FPC_323_SOURCE_COMMIT -cne '483299735faef392a746646bb3d5f5737a9e53a5') {
            throw "unexpected FPC 3.2.3 source pin: $env:FPC_323_SOURCE_COMMIT"
          }
          if (($targetOs -ne '${{ matrix.expected_os }}') -or
              ($targetCpu -ne '${{ matrix.expected_cpu }}')) {
            throw "expected ${{ matrix.expected_cpu }}-${{ matrix.expected_os }}, got $targetCpu-$targetOs"
          }

      - name: Fetch exact mORMot2 pin and pinned statics
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/get-mormot.ps1
          if ($LASTEXITCODE -ne 0) { throw 'dependency fetch failed' }

      - name: Check patch applies cleanly
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/apply-upstream-fixes.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw 'patch preflight failed' }

      - name: Confirm defects on pristine pinned source
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/run-upstream-tests.ps1 -Mode Pristine
          if ($LASTEXITCODE -ne 0) { throw 'pristine differential failed' }

      - name: Apply proposed upstream fixes
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/apply-upstream-fixes.ps1
          if ($LASTEXITCODE -ne 0) { throw 'patch application failed' }

      - name: Compile and run corrected regression suite
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/run-upstream-tests.ps1 -Mode Patched
          if ($LASTEXITCODE -ne 0) { throw 'patched regression suite failed' }

      - name: Normalize macOS test hostname
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          # test.core.base bounds two syslog messages at 400 bytes. Hosted
          # ARM64 runner hostnames can exceed 80 characters, so use a stable
          # short host without changing any mORMot source or test selection.
          sudo hostname mormot-ci
          hostname

      - name: Compile and run full mORMot2 regression suite
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/run-mormot2-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw 'full mORMot2 regression suite failed' }

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $pin = ((Get-Content mormot.lock | Where-Object { $_ -match '^commit\s*=' }) -split '=', 2)[1].Trim()
          @"
          ## mORMot2 proposed upstream fixes — ${{ matrix.name }}

          - Pin: ``$pin`` (build 2.4.16897, 2026-09-16 edition)
          - Compiler: FPC 3.2.3 from ``$env:FPC_323_SOURCE_COMMIT``
          - Differential: pristine source first, then the exact patch
          - Runtime: five interface-service ``Currency`` return shapes
          - Compile-time: QuickJS ``JSRuntime`` signature
          - Source/compile gate: C ``size_t`` ↔ Pascal ``PtrUInt`` allocators
          - Darwin link gate: address-free ``kIOMasterPortDefault`` constant
          - Upstream coverage: full official ``test/mormot2tests.dpr`` suite with checksum-pinned reference data
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
